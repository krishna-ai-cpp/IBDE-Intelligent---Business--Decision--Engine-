services:
  - type: web
    name: ibde
    runtime: python
    branch: main
    plan: free
    buildCommand: "python -m pip install -r requirements.txt"
    startCommand: "python -m uvicorn final_integration:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeployTrigger: commit
